name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Mod
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          combine: true

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lancelot_BOT
          path: "*.geode"
